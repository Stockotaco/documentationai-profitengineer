                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing or invalid API key (from `apiKeyAuth`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: 'API key lacks the `chat` permission (`{ error: "Permission denied", message: "This
