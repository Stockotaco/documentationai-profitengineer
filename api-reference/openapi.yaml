  /v1/metrics/{id}/value:
    parameters:
    - name: id
      in: path
      required: true
      description: Metric id.
      schema:
        type: string
    get:
      operationId: getMetricValue
      tags:
      - metrics
      summary: Resolve a metric's value for a period
      description: 'Resolves the metric''s value by running its OWN governed query through the same executor
        MCP and the chat surfaces use, so every caller gets the same number. Falls back to the hand-entered
        actual when the metric has no governed SQL (`source: stored_actual`). If the query groups without
        a grand-total row the response carries the slices and `source: query_breakdown_only` with a null
        `value` — do not sum the slices. Required scope: `metrics:read` OR `metrics:write` (requireAnyScope).'
      parameters:
      - name: period
        in: query
        required: false
        description: Period label at the metric's own source grain (e.g. `2026-M03`). Defaults to the
          current period at that grain. A label at a different grain, or an unparseable label, is a 400.
        schema:
          type: string
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys.
        schema:
          type: string
      responses:
        '200':
          description: The resolved value plus the citation fields for the metric and period.
          content:
            application/json:
              schema:
                type: object
                required:
                - metric_id
                - metric
                - definition
                - calculation
                - format
                - unit
                - period
                - period_start
                - period_end
                - value
                - target
                - source
                properties:
                  metric_id:
                    type: string
                  metric:
                    type: string
                    description: Metric name.
                  definition:
                    type: string
                    nullable: true
                  calculation:
                    type: string
                    nullable: true
                  format:
                    type: string
                  unit:
                    type: string
                    nullable: true
                  period:
                    type: string
                  period_start:
                    type: string
                    format: date
                  period_end:
                    type: string
                    format: date
                  value:
                    type: number
                    nullable: true
                    description: Null for `stored_actual` with no entered actual, and for `query_breakdown_only`.
                  value_column:
                    type: string
                    description: 'Name of the column the value came from. Only on `source: query`.'
                  target:
                    type: number
                    nullable: true
                  percent:
                    type: number
                    nullable: true
                    description: Absent on `query_breakdown_only`.
                  status:
                    type: string
                    nullable: true
                    enum:
                    - good
                    - warn
                    - bad
                    description: Absent on `query_breakdown_only`.
                  source:
                    type: string
                    enum:
                    - query
                    - stored_actual
                    - query_breakdown_only
                  breakdown_by:
                    type: string
                    description: Dimension column name, when the query is grouped.
                  breakdown:
                    type: array
                    description: Per-slice values, biggest first, when the query is grouped.
                    items:
                      type: object
                      required:
                      - label
                      - value
                      properties:
                        label:
                          type: string
                        value:
                          type: number
                          nullable: true
                  truncated:
                    type: boolean
                    description: True when the row cap (200) was hit, so the breakdown (and possibly the
                      total) is incomplete.
                  note:
                    type: string
                    description: Guidance for the caller; present for stored_actual, breakdown-only, and
                      truncated results.
                  sql:
                    type: string
                    description: 'The governed SQL actually run, with the period bound. Only on `source:
                      query`.'
        '400':
          description: The metric tool returned an error - metric not found for this client, a `period`
            at the wrong grain or unparseable, the governed query not allowed for this client, the query
            returning no numeric value, or the query failing.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    description: 'Tool error text with the leading "Error: " stripped.'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Key lacks both `metrics:read` and `metrics:write`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
  /v1/models:
    get:
      operationId: listModels
      tags:
      - models
      summary: List available AI models
      description: 'Lists the AI models available for `ai_analysis` alert `aiModel` overrides, sourced
        from the shared model registry (retired entries excluded). Scope: none required — any valid API
        key may read it (reference data, no client scope needed). Auth is the route-group middleware (`apiKeyAuth`:
        `Authorization: Bearer secret_xxx`) plus per-key `rateLimit`; there is no `requireScope` / `requireAnyScope`
        on this route.'
      responses:
        '200':
          description: The offered models, flat and grouped by provider.
          headers:
            X-RateLimit-Limit:
              description: Requests allowed per minute for this API key.
              schema:
                type: string
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: string
            X-RateLimit-Reset:
              description: Unix seconds when the current window resets.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - models
                - grouped
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - provider
                      - contextWindow
                      - costTier
                      properties:
                        id:
                          type: string
                          description: Friendly model id, used as an alert's `aiModel` value.
                        name:
                          type: string
                          description: Display name.
                        provider:
                          type: string
                          enum:
                          - anthropic
                          - google
                          - openrouter
                          - cloudflare
                          - other
                        contextWindow:
                          type: integer
                        costTier:
                          type: string
                          enum:
                          - $
                          - $$
                          - $$$
                          - $$$$
                  grouped:
                    type: object
                    description: 'The same models bucketed by provider. Keys are always present: `anthropic`,
                      `google`, `openrouter`, `cloudflare`, and `other` (`other` is always an empty array).'
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - name
                        - provider
                        - contextWindow
                        - costTier
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          provider:
                            type: string
                            enum:
                            - anthropic
                            - google
                            - openrouter
                            - cloudflare
                            - other
                          contextWindow:
                            type: integer
                          costTier:
                            type: string
                            enum:
                            - $
                            - $$
                            - $$$
                            - $$$$
        '401':
          description: Missing or invalid API key (from `apiKeyAuth` middleware).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing or invalid credentials
                  message:
                    type: string
        '429':
          description: Per-API-key rate limit exceeded (from `rateLimit` middleware).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Rate limit exceeded
                  message:
                    type: string
                  retryAfter:
                    type: integer
                    description: Seconds until the rate-limit window resets.
        '502':
          description: The model registry could not be read (handler catch branch).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The thrown error's message.
