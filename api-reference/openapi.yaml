  /v1/incrementality/markets:
    get:
      operationId: suggestControlMarkets
      tags:
      - incrementality
      summary: Rank control-market candidates for a geo-holdout test
      description: 'Requires scope `incrementality:read`.


        Ranks candidate control markets by how closely their daily conversions track the test set. Either
        seed `test_regions`, or supply `event_name` and let Mythic rank markets for that event. With neither,
        the request fails with 400 (test_regions or event_name is required).


        `test_regions` arrives as a comma-separated string; the route splits, trims and drops empties
        before calling the core. The 200 body is Mythic''s `data` passed through.'
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: 'REQUIRED for agency-scoped API keys: names the target client by id, slug or name.
          Ignored for client-bound keys. Omitting it on an agency key returns 400; no match returns 404;
          an ambiguous name returns 409.'
        schema:
          type: string
      - name: test_regions
        in: query
        required: false
        description: Comma-separated test regions, e.g. CA,NV,AZ. Required unless event_name is supplied.
        schema:
          type: string
      - name: measure
        in: query
        required: false
        description: '`revenue` (monetary value, Mythic''s default) or `count` for lead-gen events that
          carry no value.'
        schema:
          type: string
          enum:
          - revenue
          - count
      - name: event_name
        in: query
        required: false
        description: Conversion event to measure. Mythic defaults to the literal `purchase` event.
        schema:
          type: string
      - name: json_path
        in: query
        required: false
        description: Where the monetary value lives in the event properties, e.g. $.meta_amount. Mythic
          default $.value.
        schema:
          type: string
      - name: lookback_days
        in: query
        required: false
        description: 'Window in days, clamped by the core to 1..365. This is the lever for a scan_limit_exceeded
          failure: narrow the window.'
        schema:
          type: integer
          minimum: 1
          maximum: 365
      responses:
        '200':
          description: Mythic's market-suggestion payload, plus `notice` when the window was narrowed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  notice:
                    type: string
                    description: Present only when Mythic silently shortened the lookback window. Verdicts
                      are then NOT comparable with a full-window result.
                  window_narrowed:
                    type: object
                    additionalProperties: true
                    properties:
                      requested_lookback_days:
                        type: integer
                      used_lookback_days:
                        type: integer
                      reason:
                        type: string
        '400':
          description: 'The caller''s request is wrong, or an unmapped failure (400 is this route''s fallback
            status). Mapped codes: invalid_config, invalid_definition, unsupported_channel, scope_rejected.
            Also `Incrementality is not configured for this client (Mythic Analytics not linked)`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable message. For an upstream taxonomy failure the leading
                      '[code] ' is stripped out into `code`.
                  code:
                    type: string
                    description: Mythic's machine-readable code, e.g. dataset_missing, scan_limit_exceeded,
                      insufficient_data, invalid_definition, not_found, rate_limited.
                    example: scan_limit_exceeded
                  retryAfter:
                    type: string
                    description: Seconds to wait; present on rate_limited. Also sent as the Retry-After
                      header.
                required:
                - error
        '401':
          description: Missing, invalid, revoked or expired API key, or a key that resolves to neither
            a client nor an agency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '403':
          description: 'Permission denied: key missing the required scope, its run-as user deactivated,
            or (on writes) a non-agency key. Body is {error, message} from the middleware, or {error,
            code} when Mythic refused (agency_required, hipaa_restricted).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '404':
          description: '`not_found` from Mythic, or this route''s 404 fallback (`Experiment not found`)
            when the failure carries no mapped code.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable message. For an upstream taxonomy failure the leading
                      '[code] ' is stripped out into `code`.
                  code:
                    type: string
                    description: Mythic's machine-readable code, e.g. dataset_missing, scan_limit_exceeded,
