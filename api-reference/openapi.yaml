  /v1/skills:
    get:
      operationId: listSkills
      tags:
      - skills
      summary: List the client's visible skill library
      description: 'Returns the skill library the authenticated key''s client can see: platform

        skills, its agency''s skills, and its own, each row annotated with `scope`,

        `editable`, and `shadowed`. Ordered by name.


        Required scope: `skills:read` OR `skills:write` (requireAnyScope).

        Auth: API key (`Authorization: Bearer secret_xxx`). Agency-wide keys must

        also send `X-Client-Id`.

        '
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys; ignored for client-scoped
          keys.
        schema:
          type: string
      responses:
        '200':
          description: The visible skill library
          content:
            application/json:
              schema:
                type: object
                required:
                - skills
                properties:
                  skills:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/x-schemas/Skill'
                      - type: object
                        properties:
                          scope:
                            type: string
                            enum:
                            - client
                            - agency
                            - platform
                          editable:
                            type: boolean
                            description: True when the row is owned by this client.
                          shadowed:
                            type: boolean
                            description: True when a fork owned by this client (or its agency) hides this
                              row.
        '400':
          description: Agency-wide key did not resolve a target client
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '401':
          description: Missing, malformed, revoked, or expired API key
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '403':
          description: 'Permission denied: key lacks skills:read and skills:write'
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/RateLimitError'
    post:
      operationId: createSkill
      tags:
      - skills
      summary: Create a client-owned skill
      description: 'Creates a skill owned by the authenticated key''s client. Passing

        `forkedFromSkillId` records a copy-on-write fork of an inherited

        (platform/agency) skill: the fork keeps the source''s slug and shadows it

        in the library. Slug is derived from `name` and must be unique among this

        client''s own skills.


        Required scope: `skills:write` (requireScope).

        Auth: API key. Agency-wide keys must also send `X-Client-Id`.

        '
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                  description: Should say WHEN to use the skill; a description without a trigger phrase
                    is accepted but discouraged.
                content:
                  type: string
                  nullable: true
                  description: The skill body (SKILL.md).
                config:
                  $ref: '#/x-schemas/SkillConfigInput'
                isEnabled:
                  type: boolean
                  default: true
                forkedFromSkillId:
                  type: string
                  nullable: true
                  description: Id of an in-scope, non-client-owned skill to fork (copy-on-write).
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema:
                type: object
                required:
                - skill
                properties:
                  skill:
                    $ref: '#/x-schemas/Skill'
        '400':
          description: Validation failure thrown by the skill core (missing name/description, bad `config`,
            slug clash, fork source not found), or an agency-wide key with no resolvable target client.
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '401':
          description: Missing, malformed, revoked, or expired API key
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '403':
          description: 'Permission denied: key lacks skills:write'
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/RateLimitError'
  /v1/skills/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Skill id.
      schema:
        type: string
    - name: X-Client-Id
      in: header
      required: false
      description: Target client id, slug, or name. Required for agency-wide API keys; ignored for client-scoped
        keys.
      schema:
        type: string
    get:
      operationId: getSkill
      tags:
      - skills
      summary: Get one in-scope skill
      description: 'Returns a single skill visible to this client (its own, or an inherited

        agency/platform skill), annotated with `scope` and `editable`.


