          description: 'Permission denied: key lacks skills:read and skills:write'
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '404':
          description: Skill not found or not in scope for this client
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/NotFoundError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/RateLimitError'
    patch:
      operationId: updateSkill
      tags:
      - skills
      summary: Update a client-owned skill
      description: 'Sparse patch of a skill owned by the authenticated key''s client. Inherited

        platform/agency skills cannot be patched (they resolve to 404 here — fork

        them with POST /v1/skills instead). Renaming a non-fork re-derives its

        slug; a fork keeps its source''s slug. On success the agent cache is

        invalidated so edits take effect immediately.


        Required scope: `skills:write` (requireScope).

        Auth: API key. Agency-wide keys must also send `X-Client-Id`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                content:
                  type: string
                  nullable: true
                config:
                  $ref: '#/x-schemas/SkillConfigInput'
                isEnabled:
                  type: boolean
      responses:
        '200':
          description: Skill updated
          content:
            application/json:
              schema:
                type: object
                required:
                - skill
                properties:
                  skill:
                    $ref: '#/x-schemas/Skill'
        '400':
          description: Validation failure thrown by the skill core (empty name/description, bad `config`,
            slug clash), a zod body validation error, or an agency-wide key with no resolvable target
            client.
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '401':
          description: Missing, malformed, revoked, or expired API key
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '403':
          description: 'Permission denied: key lacks skills:write'
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '404':
          description: Skill not found among this client's own skills
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/NotFoundError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/RateLimitError'
    delete:
      operationId: deleteSkill
      tags:
      - skills
      summary: Delete a client-owned skill
      description: 'Deletes a skill owned by the authenticated key''s client. Equipped agents

        detach via the agent_skills cascade; there is no reference guard. On

        success the agent cache is invalidated.


        Required scope: `skills:write` (requireScope).

        Auth: API key. Agency-wide keys must also send `X-Client-Id`.

        '
      responses:
        '200':
          description: Skill deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
        '400':
          description: Delete failed in the skill core, or an agency-wide key with no resolvable target
            client.
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '401':
          description: Missing, malformed, revoked, or expired API key
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '403':
          description: 'Permission denied: key lacks skills:write'
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '404':
          description: Skill not found among this client's own skills
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/NotFoundError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/RateLimitError'
  /v1/web/extract:
    post:
      operationId: extractWebPageData
      tags:
      - web
      summary: AI structured extraction from a web page
      description: 'Renders the URL and runs Cloudflare''s AI JSON extraction over it, guided by a

        natural-language `prompt`, a JSON Schema, or both. At least one of `prompt` or

        `schema` is required. Read-only external fetch; the resolved client is used only

        for usage attribution, rate limiting, and the monthly `web` browsing budget.


        Required scope: `web:read`.


        Auth: API key via `Authorization: Bearer secret_...`. Agency-wide keys must also

        send `X-Client-Id` (client id, slug, or name).

        '
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client (id, slug, or name). Required for agency-wide API keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              description: Must include `prompt` and/or `schema`.
              properties:
                url:
                  type: string
                  format: uri
                prompt:
                  type: string
                  description: What to extract, in natural language.
                schema:
                  type: object
                  additionalProperties: true
                  description: JSON Schema passed to Browser Run as `response_format.json_schema`.
                waitForSelector:
                  type: string
                  description: CSS selector to wait for before extracting.
      responses:
        '200':
          description: Extracted data
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - data
                properties:
                  url:
                    type: string
                    format: uri
                  data:
                    description: Extraction result from Cloudflare, passed through unchanged. Its shape
                      follows the caller's `schema` when one is supplied, and is otherwise model-determined.
        '400':
          description: 'Validation failure (including neither `prompt` nor `schema` supplied), an

            unfetchable URL, a render timeout (30s), the monthly `web` budget being

            exhausted, or web browsing not being configured. Also returned when an

            agency-wide key omits `X-Client-Id`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing, malformed, revoked, expired, or unresolvable API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Key lacks the `web:read` scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: '`X-Client-Id` does not match any client in the agency'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Per-key rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
  /v1/web/fetch:
    post:
      operationId: fetchWebPage
      tags:
      - web
      summary: Fetch a web page as markdown, HTML, or a link list
      description: 'Renders the URL with headless Chrome (Cloudflare Browser Run) and returns the page

        as markdown (default), raw HTML, or its extracted links. Read-only external fetch;

        no client data is read or written — the resolved client is used only for usage

        attribution, rate limiting, and the monthly `web` browsing budget.


        Required scope: `web:read`.


        Auth: API key via `Authorization: Bearer secret_...`. Agency-wide keys must also

        send `X-Client-Id` (client id, slug, or name).


        Content longer than 60000 characters is truncated (`truncated: true` in the response).

        Identical requests are served from a 5-minute cache.

        '
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client (id, slug, or name). Required for agency-wide API keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                  description: http(s) URL to render.
                format:
                  type: string
                  enum:
                  - markdown
                  - html
                  - links
                  default: markdown
                  description: Output shape. `links` returns the page's links instead of text.
                waitForSelector:
                  type: string
                  description: CSS selector to wait for before capturing the page.
      responses:
        '200':
          description: Page content
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: format = markdown | html
                  required:
                  - url
                  - format
                  - content
                  properties:
                    url:
                      type: string
                      format: uri
                    format:
                      type: string
                      enum:
                      - markdown
                      - html
                    content:
                      type: string
                    truncated:
                      type: boolean
                      description: Present and true only when the content was cut off.
                    hint:
                      type: string
                      description: Present only when truncated.
                - type: object
                  description: format = links
                  required:
                  - url
                  - links
                  properties:
                    url:
                      type: string
                      format: uri
                    links:
                      type: array
                      description: Links returned by Browser Run (shape passed through unchanged).
                      items:
                        type: string
        '400':
          description: 'Validation failure, an unfetchable URL, a render timeout (30s), the monthly

            `web` budget being exhausted, or web browsing not being configured for the

            deployment. Also returned when an agency-wide key omits `X-Client-Id`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing, malformed, revoked, expired, or unresolvable API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Key lacks the `web:read` scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Permission denied
                  message:
                    type: string
        '404':
          description: '`X-Client-Id` does not match any client in the agency'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Per-key rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Rate limit exceeded
                  message:
                    type: string
                  retryAfter:
                    type: integer
                    description: Seconds until the rate-limit window resets.
  /v1/web/scrape:
    post:
      operationId: scrapeWebPageElements
      tags:
      - web
      summary: Scrape elements from a web page by CSS selector
      description: 'Renders the URL and returns the elements matching each supplied CSS selector.

        Read-only external fetch; the resolved client is used only for usage attribution,

        rate limiting, and the monthly `web` browsing budget.


        Required scope: `web:read`.


        Auth: API key via `Authorization: Bearer secret_...`. Agency-wide keys must also

        send `X-Client-Id` (client id, slug, or name).


        The serialized element payload is truncated past 60000 characters

        (`truncated: true` in the response).

        '
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client (id, slug, or name). Required for agency-wide API keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - selectors
              properties:
                url:
                  type: string
                  format: uri
                selectors:
                  type: array
                  minItems: 1
                  description: One or more CSS selectors to extract.
                  items:
                    type: string
                    minLength: 1
                waitForSelector:
                  type: string
                  description: CSS selector to wait for before scraping.
      responses:
        '200':
          description: Scraped elements
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - elements
                properties:
                  url:
                    type: string
                    format: uri
                  elements:
                    type: array
                    description: Per-selector scrape results from Browser Run, passed through unchanged.
                    items:
                      type: object
                      additionalProperties: true
                  truncated:
                    type: boolean
                    description: Present and true only when the payload was cut off.
        '400':
          description: 'Validation failure, an unfetchable URL, a render timeout (30s), the monthly

            `web` budget being exhausted, or web browsing not being configured. Also

            returned when an agency-wide key omits `X-Client-Id`.

            '
          content:
            application/json:
              schema:
