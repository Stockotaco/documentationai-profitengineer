          application/json:
            schema:
              $ref: '#/components/schemas/ReportsChatStreamRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReportsChatStream'
        '402':
          description: AI credit limit exceeded, monthly AI budget reached, or no provider API key configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
