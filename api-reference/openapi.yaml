      summary: Create a geo-holdout experiment
      description: 'Requires scope `incrementality:write` AND an agency-scoped API key: a client-bound
        key is rejected with 403 `This operation requires an agency-scoped API key` before the scope check
        is reached. Writes change real Meta ad targeting.


        Mythic validates the definition at create time by building the compute query, so an uncomputable
        definition comes back as 400 invalid_definition: there is no dry-run or rollback step. There is
        no edit endpoint either, so a typo is fixed by delete + recreate.


        The body is parsed with a fallback to an empty object on malformed JSON, so a broken body surfaces
        as 400 (name is required) rather than a parse error. This route has no Zod validator.'
      parameters:
      - name: X-Client-Id
        in: header
        required: false
