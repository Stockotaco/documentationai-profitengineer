  /v1/constraints/benchmarks:
    get:
      operationId: getFunnelBenchmarks
      tags:
      - constraints
      summary: Read the stored benchmark targets
      description: 'Requires scope `constraints:read`.


        Delegates to the `get_funnel_benchmarks` tool (`constraintsCore.getBenchmarks`). Takes no

        parameters at all - the route passes an empty argument object.


        Also requires API key auth plus a resolved client, and is rate limited.

        '
      responses:
        '200':
          description: Upstream stored-benchmark listing, returned as received. The shape is defined by
            Mythic's `/client/v1/constraints/benchmarks` rather than by this gateway.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Fallback for any unmapped or absent error code, including "the Constraint Finder
            is not configured for this client".
          content:
            application/json:
              schema: *id001
        '404':
          description: '`not_found`.'
          content:
            application/json:
              schema: *id001
        '424':
          description: Upstream or provisioning fault.
          content:
            application/json:
              schema: *id001
        '429':
          description: '`rate_limited`.'
          headers:
            Retry-After: *id008
          content:
            application/json:
              schema: *id001
    put:
      operationId: setFunnelBenchmark
      tags:
      - constraints
      summary: Store standing benchmark targets for a scope
      description: 'Requires scope `constraints:write` (staff-grantable only: a stored target silently
        changes

        what every future diagnosis says about every campaign).


        Delegates to the `set_funnel_benchmark` tool (`constraintsCore.setBenchmarks`).


        PUT, not PATCH, because it REPLACES the whole scope: any step you omit falls back to the

        account''s pooled rate rather than keeping its previous stored value. The success response

        restates this in `notice`.


        Rates, never percentages - a 2% rate is `0.02`. A value above 1, an unknown step name, or

        an empty benchmarks object is rejected with 400.


        Also requires API key auth plus a resolved client, and is rate limited.

        '
      requestBody:
        required: true
        description: An absent or malformed JSON body is tolerated as `{}` and then fails validation on
          the missing `benchmarks`.
        content:
          application/json:
            schema:
              type: object
              properties:
                benchmarks:
                  type: object
                  description: Per-step target rates. At least one step is required.
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    ad:
                      type: number
                      minimum: 0
                      maximum: 1
                    tracking:
                      type: number
                      minimum: 0
                      maximum: 1
                    landing:
                      type: number
                      minimum: 0
                      maximum: 1
                    sales:
                      type: number
                      minimum: 0
                      maximum: 1
                    site:
                      type: number
                      minimum: 0
                      maximum: 1
                campaign:
                  type: string
                  description: Scope the targets to one campaign. Omitted stores the account default.
                note:
                  type: string
                  description: Free-text note stored with the targets; surfaces as `benchmark_note` on
                    findings.
              required:
              - benchmarks
      responses:
        '200':
          description: Targets stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  stored:
                    type: object
                    additionalProperties: true
                    description: Upstream's confirmation payload, returned as received.
                  notice:
                    type: string
                    description: Constant reminder that a PUT replaces the whole scope, sent on every
                      success.
                required:
                - success
                - stored
                - notice
        '400':
          description: '`benchmarks` missing, not an object, empty, naming an unknown step, or carrying
            a value outside 0-1 (the percentage-versus-rate mistake). Also upstream `invalid_benchmark`,
            and the fallback for any unmapped error code.'
          content:
            application/json:
              schema: *id001
        '404':
          description: '`campaign_not_found` / `not_found`.'
          content:
            application/json:
              schema: *id001
        '424':
          description: Upstream or provisioning fault.
          content:
            application/json:
              schema: *id001
        '429':
          description: '`rate_limited`.'
          headers:
            Retry-After: *id008
          content:
            application/json:
              schema: *id001
    delete:
      operationId: clearFunnelBenchmark
      tags:
      - constraints
      summary: Clear a stored benchmark target
      description: 'Requires scope `constraints:write`.


        Delegates to the `clear_funnel_benchmark` tool (`constraintsCore.clearBenchmarks`). Clears

        one step across scopes, or an entire scope. Both parameters omitted clears the account

        default.


        Also requires API key auth plus a resolved client, and is rate limited.

        '
      parameters:
      - name: step
        in: query
        required: false
        description: Funnel step to clear. An unknown value is rejected with 400.
        schema:
          type: string
          enum:
          - ad
          - tracking
          - landing
          - sales
          - site
      - name: campaign
        in: query
        required: false
        description: Scope to clear. Omitted means the account default.
        schema:
          type: string
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  remaining:
                    type: object
                    additionalProperties: true
                    description: 'Upstream''s remaining-targets payload, returned as received. Falls back
                      to `{ cleared: true }` when the upstream returns no body.'
                required:
                - success
                - remaining
        '400':
          description: Unknown funnel step, and the fallback for any unmapped error code.
          content:
            application/json:
              schema: *id001
        '404':
          description: '`campaign_not_found` / `not_found`.'
          content:
            application/json:
              schema: *id001
        '424':
          description: Upstream or provisioning fault.
          content:
            application/json:
              schema: *id001
        '429':
          description: '`rate_limited`.'
          headers:
            Retry-After: *id008
          content:
            application/json:
              schema: *id001
  /v1/constraints/events:
