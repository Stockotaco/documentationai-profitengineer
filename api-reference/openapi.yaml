            createdBy:
              type: string
              nullable: true
            lastRunAt:
              type: string
              format: date-time
              nullable: true
            nextRunAt:
              type: string
              format: date-time
              nullable: true
            lastError:
              type: string
              nullable: true
            consecutiveErrors:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        ScheduledTaskRun:
          type: object
          description: A row of `scheduled_task_runs`.
          properties:
            id:
              type: string
            taskId:
              type: string
            clientId:
              type: string
              nullable: true
            startedAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              description: e.g. running, success, error (default `running`).
            summary:
              type: string
              nullable: true
            proposals:
              type: array
              nullable: true
              description: Free-form proposal objects; indexed by `proposalIndex` in the decision routes.
              items:
                type: object
                additionalProperties: true
            reviewStatus:
              type: string
              description: Default `pending`.
            reviewedBy:
              type: string
              nullable: true
            reviewedAt:
              type: string
              format: date-time
              nullable: true
            reviewSlackMessage:
              type: object
              nullable: true
              properties:
                connectionId:
                  type: string
                  nullable: true
                channelId:
                  type: string
                ts:
                  type: string
            toolCalls:
              description: Free-form JSON.
              nullable: true
            costUsd:
              type: string
              nullable: true
            errorMessage:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
        Error:
          type: object
          properties:
            error:
              type: string
            message:
              type: string
        Unauthorized:
          description: Missing or invalid API key (apiKeyAuth middleware).
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
        Forbidden:
          description: Permission denied — the key lacks the required scope.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
        MissingTargetClient:
          description: 'Agency-wide key without the `X-Client-Id` header (requireResolvedClient), or a

            request-body/validation failure on write routes.

            '
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
        ClientNotFound:
          description: No client matching `X-Client-Id` exists in this agency.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
        AmbiguousClient:
          description: Multiple clients share that `X-Client-Id` name — send an id.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
        RateLimited:
          description: Rate limit exceeded (rateLimit middleware).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
                    description: Seconds until the window resets.
    post:
      operationId: createScheduledTask
      summary: Create a scheduled task
      description: 'Creates a scheduled task owned by the API key''s client. Required scope: `tasks:write`.

        A task needs `instruction`, `commands`, or both — "neither" is a 400. `commands[].autoRun`

        is only honored for agency-type keys. Per-client task-count and budget caps are enforced

        by the core and surface as 400s.

        '
      tags:
      - scheduled-tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - cronExpression
              properties:
                name:
                  type: string
                  minLength: 1
                instruction:
                  type: string
                commands:
                  type: array
                  nullable: true
                  items:
                    type: object
                    required:
                    - tool
                    properties:
                      tool:
                        type: string
                        minLength: 1
                      args:
                        type: object
                        additionalProperties: true
                      autoRun:
                        type: boolean
                cronExpression:
                  type: string
                  minLength: 1
                timezone:
                  type: string
                  description: Defaults to UTC.
                enabledTools:
                  description: Free-form JSON.
                modelId:
                  type: string
                  nullable: true
                agentId:
                  type: string
                  nullable: true
                monthlyBudgetUsd:
                  nullable: true
                  oneOf:
                  - type: string
                  - type: number
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                required:
                - task
                properties:
                  task:
                    $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/ScheduledTask'
        '400':
          description: Zod validation failure, or a ScheduledTaskValidationError (task cap, bad agentId,
            no instruction and no commands).
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
        '401':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Unauthorized'
        '403':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Forbidden'
        '404':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/ClientNotFound'
        '409':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/AmbiguousClient'
        '429':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/RateLimited'
        '500':
          description: Failed to create scheduled task
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/Error'
