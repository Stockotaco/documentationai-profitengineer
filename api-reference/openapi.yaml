                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
        '500':
          description: '`{ error: "Failed to list sessions" }`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
