  /v1/memories:
    get:
      operationId: listMemories
      tags:
      - memories
      summary: List memories for the resolved client
      description: 'Requires scope `memories:read` OR `memories:write` (requireAnyScope). Returns the
        API key user''s personal memories plus client-shared ones, newest first (core default limit 50).
        A key with no associated user sees SHARED memories only. Agency-internal (`agencyOnly`) memories
        are included only for agency-scoped keys; client keys are fail-closed.

        '
      parameters:
      - name: category
        in: query
        required: false
        description: 'Filter by category. Values other than `daily` / `long_term` are ignored (treated
          as no filter).

          '
        schema:
          type: string
          enum:
          - long_term
          - daily
      - name: X-Client-Id
        in: header
        required: false
        description: 'Required for agency-wide API keys — target client id, slug, or name. Ignored for
          client-scoped keys.

          '
        schema:
          type: string
      responses:
        '200':
          description: The visible memories
          content:
            application/json:
              schema:
                type: object
                required:
                - memories
                properties:
                  memories:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - agencyId
                      - clientId
                      - userId
                      - agentId
                      - category
                      - title
                      - content
                      - tags
                      - shared
                      - agencyOnly
                      - createdAt
                      - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                        agencyId:
                          type: string
                        clientId:
                          type: string
                        userId:
                          type: string
                          nullable: true
                        agentId:
                          type: string
                          nullable: true
                        category:
                          type: string
                          enum:
                          - long_term
                          - daily
                        title:
                          type: string
                        content:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        shared:
                          type: boolean
                        agencyOnly:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
        '400':
          description: Agency-wide key did not send the `X-Client-Id` header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing, malformed, revoked, or inactive API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Permission denied — key lacks memories:read / memories:write
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: No client in this agency matches `X-Client-Id`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: '`X-Client-Id` name is ambiguous — send an id instead'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded for this API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
    post:
      operationId: createMemory
      tags:
      - memories
      summary: Create a memory
      description: 'Requires scope `memories:write`. The memory is authored by the API key''s associated
        user; a key with no user always creates a client-SHARED memory (the request''s `shared` value
        is forced to true). `agencyOnly: true` requires an agency-scoped key, otherwise 403. `category`
