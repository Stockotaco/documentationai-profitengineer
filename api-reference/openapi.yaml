                    format: uuid
                    description: Id of the persisted assistant message.
                  sessionId:
                    type: string
                    description: Session the exchange was recorded under.
                  message:
                    type: string
                    description: Full assistant response text.
                  usage:
                    type: object
                    properties:
                      inputTokens:
                        type: integer
                      outputTokens:
                        type: integer
        '400':
          description: 'Request body failed validation, or an agency-wide key omitted the `X-Client-Id`
            header.

            '
          content:
            application/json:
              schema:
