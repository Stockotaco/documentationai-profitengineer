                        createdAt:
                          type: string
                          format: date-time
                        lastMessageAt:
                          type: string
                          format: date-time
                        messageCount:
                          type: integer
                          description: Total messages in the session (user and assistant).
                        preview:
                          type: string
                          description: First 100 characters of the first user message; empty string if
                            none.
        '400':
