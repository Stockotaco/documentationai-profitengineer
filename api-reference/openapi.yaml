  /v1/documents/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Document id (UUID).
      schema:
        type: string
    - name: X-Client-Id
      in: header
      required: false
      description: 'Agency-scoped keys only: target client id within the agency.'
      schema:
        type: string
    get:
      operationId: getDocument
      summary: Get a document with its full text
      description: 'Returns one document including its body (`content`, from the stored

        extractedText; empty string when unset). Scoped to the authenticated client;

        agency-only documents are invisible (404) to client-scoped keys.


        Required scope: `documents:read` OR `documents:write` (requireAnyScope).

        '
      tags:
      - documents
      responses:
        '200':
          description: Document with content
          content:
            application/json:
              schema:
                type: object
                required:
                - document
                properties:
                  document:
                    type: object
                    required:
                    - id
                    - name
                    - category
                    - sourceLink
                    - fileType
                    - sizeBytes
                    - agencyOnly
                    - createdAt
                    - content
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                        nullable: true
                      sourceLink:
                        type: string
                        nullable: true
                      fileType:
                        type: string
                      sizeBytes:
                        type: integer
                      agencyOnly:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      content:
                        type: string
                        description: Full document text ("" when the document has no extracted text).
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Missing required scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Permission denied
                  message:
                    type: string
        '404':
          description: Document not found (or agency-only and the key is client-scoped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Document not found
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
    patch:
      operationId: updateDocument
      summary: Update a document
      description: 'Partially updates a document. `content` replaces the body by default, or is

        appended when `mode: "append"` (a newline is inserted first when the existing

        body does not end with one). `category` / `sourceLink` set to null clear the

        field. Setting `agencyOnly: true` requires an agency-scoped key (403); an

        explicit false from a client-scoped key is a no-op rather than an error.

        Documents synced from a Drive folder watch reject `agencyOnly` with 400.

        Response carries metadata only (the body is not echoed back).


        Required scope: `documents:write`.

        '
      tags:
      - documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                content:
                  type: string
                  description: New body text (max 1,000,000 bytes UTF-8).
                mode:
                  type: string
                  enum:
                  - replace
                  - append
                  description: How `content` is applied. Defaults to replace.
                category:
                  type: string
                  nullable: true
                  description: null clears the category.
                sourceLink:
                  type: string
                  nullable: true
                  description: null clears the source link.
                agencyOnly:
                  type: boolean
                  description: Coerced via coerceBooleanArg. Setting true requires an agency-scoped key.
      responses:
        '200':
          description: Updated document metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - document
                properties:
                  document:
                    type: object
                    required:
                    - id
                    - name
                    - category
                    - sourceLink
                    - fileType
                    - sizeBytes
                    - agencyOnly
                    - createdAt
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                        nullable: true
                      sourceLink:
                        type: string
                        nullable: true
                      fileType:
                        type: string
                      sizeBytes:
                        type: integer
                      agencyOnly:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Rejected by the document core (an append that overflows the size cap, or setting
            agencyOnly on a Drive-synced document), or an invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to update document
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: 'Missing `documents:write` scope, or `agencyOnly: true` from a non-agency key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Setting agencyOnly requires an agency-scoped key
                  message:
                    type: string
        '404':
          description: Document not found (or agency-only and the key is client-scoped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Document not found
        '413':
          description: Content too large (raw `content` over 1,000,000 bytes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Content too large (max 1000KB).
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
    delete:
      operationId: deleteDocument
