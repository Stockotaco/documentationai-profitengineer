  /v1/chat/stream:
    post:
      operationId: streamChatCompletion
      summary: Send a chat message (Server-Sent Events stream)
      tags:
      - chat
      description: 'Same agent run as `POST /v1/chat`, streamed back as Server-Sent Events.


        Required scope: none — identical middleware chain to `POST /v1/chat`

        (`apiKeyAuth`, `requireResolvedClient`, `requireChatPermission`, `rateLimit`), so

        the API key needs the `chat` permission flag. `mcp:read` / `mcp:write` again only

        affect which client-connected MCP tools the agent is given.


        Every SSE frame uses the event name `message`; the payload is

        `{"type": "<event type>", "data": {...}}`. Emitted types, in order of the agent

        loop: `thinking`, `thinking_delta`, `thinking_end`, `content_delta`,

        `tool_call_start`, `tool_call_progress`, `tool_call_result`, `content_done`,

        `done`, and `error`. `done.data` carries `{ sessionId, messageId, usage: {

        inputTokens, outputTokens, costUsd } }`. Note that errors raised after the stream

        opens arrive as an in-stream `error` frame on a 200 response, not as an HTTP error.


        Aborting the HTTP request aborts the agent loop server-side.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: 'Target client (id, slug, or name). Required for agency-wide API keys, ignored for
          client-scoped keys.

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 1
                sessionId:
                  type: string
                  description: Existing session to continue; a new one is created if omitted.
                model:
                  type: string
                clientApiKey:
                  type: string
                  description: Accepted by the validator for BYOK; not read by this handler.
      responses:
        '200':
          description: 'SSE stream. Response headers set by the handler: `X-Accel-Buffering: no`,

            `Cache-Control: no-cache`, `Connection: keep-alive`.

            '
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Newline-delimited SSE frames, each `event: message` with a JSON `data` payload
                  of shape `{"type": string, "data": object}`.

                  '
        '400':
          description: Validation failure, or agency key without `X-Client-Id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '402':
          description: AI credit limit exceeded, or no usable provider API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  balance:
                    type: string
                    nullable: true
        '403':
          description: API key does not have chat permission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: No client matching `X-Client-Id` in this agency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Ambiguous `X-Client-Id` name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded.
        '500':
          description: 'No agent configured for the agency, or model resolution failed. Errors that occur
            after the stream has started are delivered as an in-stream `error` event instead.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/chats/{chatId}/stream:
    post:
      operationId: streamChatById
      tags:
      - reports
      summary: Stream an AI chat turn for a Studio chat (SSE)
      description: 'Chat-centric sibling of the report-centric stream, declared in the same route file
        and mounted at /v1/chats. Required scope: none declared on the route (`dualAuth` + `requireResolvedClient`
        + `rateLimit` only, plus a caller/client access check against the chat''s owning client). Resolves
        the chat row to its session, client, working report, and agent, then runs the same handler; built-in
        tool availability is gated per family by the API key''s effective scopes.'
      parameters:
      - $ref: '#/components/parameters/ReportsChatId'
      requestBody:
        required: true
