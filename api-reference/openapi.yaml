  /v1/emails:
    get:
      operationId: listEmails
      tags:
      - emails
      summary: List recent emails
      description: Requires scope `emails:read`. Returns the most recent messages in the resolved client's
        inbox, newest first. Agency API keys select the tenant with the `X-Client-Id` header. Body text
        is truncated to a 240-character snippet.
      parameters:
      - name: limit
        in: query
        required: false
        description: Max messages to return. Default 30, clamped to a maximum of 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: direction
        in: query
        required: false
        description: Restrict to one direction. Any other value is ignored and both directions are returned.
        schema:
          type: string
          enum:
          - inbound
          - outbound
      - name: include_archived
        in: query
        required: false
        description: Pass the literal string `true` to include archived messages. Anything else excludes
          them.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - $ref: '#/components/parameters/EmailsClientIdHeader'
      responses:
        '200':
          description: Matching messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsEmailList'
        '400':
          $ref: '#/components/responses/EmailsToolError'
        '401':
          $ref: '#/components/responses/EmailsUnauthorized'
        '403':
          $ref: '#/components/responses/EmailsForbidden'
        '429':
          $ref: '#/components/responses/EmailsRateLimited'
  /v1/emails/search:
    get:
      operationId: searchEmails
      tags:
      - emails
      summary: Keyword-search emails
      description: Requires scope `emails:read`. Case-insensitive substring match against message subject
        or body text, newest first. Archived messages are not excluded by this endpoint. A missing or
        blank `query` returns a 400 tool error.
      parameters:
      - name: query
        in: query
        required: true
        description: Substring matched against subject and body text.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Max messages to return. Default 20, clamped to a maximum of 50.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - $ref: '#/components/parameters/EmailsClientIdHeader'
      responses:
        '200':
          description: Matching messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsSearchResult'
        '400':
          $ref: '#/components/responses/EmailsToolError'
        '401':
          $ref: '#/components/responses/EmailsUnauthorized'
        '403':
          $ref: '#/components/responses/EmailsForbidden'
        '429':
          $ref: '#/components/responses/EmailsRateLimited'
  /v1/emails/thread:
    get:
      operationId: getEmailThread
      tags:
      - emails
      summary: Get one email thread with full message bodies
      description: Requires scope `emails:read`. `threadId` is a Message-ID such as `<id@domain>`; it
        is passed as a query parameter rather than a path segment to avoid encoding problems with its
        angle brackets and slashes. Messages are returned oldest first with full body text. A missing
        `threadId` returns 400; an unknown one returns 404.
      parameters:
      - name: threadId
        in: query
        required: true
        description: Message-ID of the conversation, e.g. `<abc123@example.com>`.
        schema:
          type: string
      - $ref: '#/components/parameters/EmailsClientIdHeader'
      responses:
        '200':
          description: The full conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsThreadDetail'
        '400':
          description: '`threadId` query param is required'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsError'
        '404':
          description: Thread not found, or the tool failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsError'
        '401':
          $ref: '#/components/responses/EmailsUnauthorized'
        '403':
          $ref: '#/components/responses/EmailsForbidden'
        '429':
          $ref: '#/components/responses/EmailsRateLimited'
  /v1/emails/threads:
    get:
      operationId: listEmailThreads
      tags:
      - emails
      summary: List email threads (triage view)
      description: Requires scope `emails:read`. One row per conversation with participants, message count,
        first/last timestamps and an `awaitingReply` flag marking threads whose latest inbound message
        is newer than the latest outbound reply. At most 500 messages are scanned when grouping; when
        that cap is hit the oldest threads are dropped and `truncated` is true. Subjects have leading
        "Re:" prefixes stripped.
      parameters:
      - name: limit
        in: query
        required: false
        description: Max threads to return. Default 25, clamped to a maximum of 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: include_archived
        in: query
        required: false
        description: Pass the literal string `true` to include archived messages when grouping threads.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - $ref: '#/components/parameters/EmailsClientIdHeader'
      responses:
        '200':
          description: Thread summaries, newest activity first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsThreadList'
        '400':
          $ref: '#/components/responses/EmailsToolError'
        '401':
          $ref: '#/components/responses/EmailsUnauthorized'
        '403':
          $ref: '#/components/responses/EmailsForbidden'
        '429':
          $ref: '#/components/responses/EmailsRateLimited'
  /v1/incrementality/coefficients:
    get:
      operationId: getIncrementalityCoefficients
      tags:
      - incrementality
      summary: Get the current per-channel incrementality coefficients
      description: 'Requires scope `incrementality:read`.


        The progressive-truth coefficient derived from this client''s computed geo-holdout experiments
        (partial results excluded). The 200 body is Mythic''s `data` passed through.'
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: 'REQUIRED for agency-scoped API keys: names the target client by id, slug or name.
          Ignored for client-bound keys. Omitting it on an agency key returns 400; no match returns 404;
          an ambiguous name returns 409.'
        schema:
          type: string
      - name: channel
        in: query
        required: false
        description: Narrow to one channel, e.g. meta. Omit for all channels.
        schema:
          type: string
      responses:
        '200':
          description: Mythic's coefficients payload. Field-level shape owned by Mythic.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 'The caller''s request is wrong, or an unmapped failure (400 is this route''s fallback
            status). Mapped codes: invalid_config, invalid_definition, unsupported_channel, scope_rejected.
            Also `Incrementality is not configured for this client (Mythic Analytics not linked)`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable message. For an upstream taxonomy failure the leading
                      '[code] ' is stripped out into `code`.
                  code:
                    type: string
                    description: Mythic's machine-readable code, e.g. dataset_missing, scan_limit_exceeded,
                      insufficient_data, invalid_definition, not_found, rate_limited.
                    example: scan_limit_exceeded
                  retryAfter:
                    type: string
                    description: Seconds to wait; present on rate_limited. Also sent as the Retry-After
                      header.
                required:
                - error
        '401':
          description: Missing, invalid, revoked or expired API key, or a key that resolves to neither
            a client nor an agency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '403':
          description: 'Permission denied: key missing the required scope, its run-as user deactivated,
            or (on writes) a non-agency key. Body is {error, message} from the middleware, or {error,
            code} when Mythic refused (agency_required, hipaa_restricted).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
        '422':
          description: 'Well-formed but the data cannot answer it: insufficient_data, result_truncated.
            Also a Mythic 2xx carrying success:false.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable message. For an upstream taxonomy failure the leading
                      '[code] ' is stripped out into `code`.
                  code:
                    type: string
                    description: Mythic's machine-readable code, e.g. dataset_missing, scan_limit_exceeded,
                      insufficient_data, invalid_definition, not_found, rate_limited.
                    example: scan_limit_exceeded
                  retryAfter:
                    type: string
                    description: Seconds to wait; present on rate_limited. Also sent as the Retry-After
                      header.
                required:
                - error
        '424':
          description: 'Upstream fault, deliberately reported as 424 rather than a 5xx of ours. Codes:
            dataset_missing, bq_unconfigured, upstream_error, query_failed, spend_table_missing, stale_spend_data,
            mixed_currencies.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable message. For an upstream taxonomy failure the leading
                      '[code] ' is stripped out into `code`.
                  code:
                    type: string
                    description: Mythic's machine-readable code, e.g. dataset_missing, scan_limit_exceeded,
                      insufficient_data, invalid_definition, not_found, rate_limited.
                    example: scan_limit_exceeded
                  retryAfter:
                    type: string
                    description: Seconds to wait; present on rate_limited. Also sent as the Retry-After
                      header.
                required:
                - error
        '429':
          description: 'Rate limited. Either the gateway''s own limiter (body {error, message, retryAfter}
            plus X-RateLimit-* headers) or Mythic''s 120 req/10s per-location limit (code: rate_limited).
            Retry-After is forwarded in both cases.'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable message. For an upstream taxonomy failure the leading
                      '[code] ' is stripped out into `code`.
                  code:
                    type: string
                    description: Mythic's machine-readable code, e.g. dataset_missing, scan_limit_exceeded,
                      insufficient_data, invalid_definition, not_found, rate_limited.
                    example: scan_limit_exceeded
                  retryAfter:
                    type: string
                    description: Seconds to wait; present on rate_limited. Also sent as the Retry-After
                      header.
                required:
                - error
