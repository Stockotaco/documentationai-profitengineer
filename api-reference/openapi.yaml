openapi: 3.0.3
info:
  title: Mythic OS API
  version: 1.0.0
  description: The REST surface of the Mythic OS client API. Every endpoint takes an API key from your
    portal.
servers:
- url: https://api-service-production-4d43.up.railway.app
components:
  parameters:
    EmailsClientIdHeader:
      name: X-Client-Id
      in: header
      required: false
      description: Target client for agency-scoped API keys. Client-scoped keys resolve their own client
        and may omit this header.
      schema:
        type: string
    ReportsChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
      description: studio_chats row id.
    ReportsMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: chat_messages row id.
    ReportsReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
      description: Report id, report slug, or a synthetic `__draft-<sessionId>` authoring draft id.
    ReportsSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: Chat session id (globally unique).
  responses:
    EmailsForbidden:
      description: 'Permission denied: the key lacks the `emails:read` scope, cannot access the target
        client, or the account is deactivated.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailsAuthError'
    EmailsRateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailsAuthError'
    EmailsToolError:
      description: The email tool returned an error (bad input, or no client resolved).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailsError'
    EmailsUnauthorized:
      description: Missing, invalid, or expired API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailsAuthError'
    ReportsBadRequest:
      description: Missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportsError'
    ReportsChatStream:
      description: 'Server-sent events. Every frame is `event: message` with a JSON body of `{ type, data
        }`. Observed types are thinking, thinking_delta, thinking_end, tool_call_start, tool_call_progress,
        tool_call_result, content_done, done, and error (with a sanitized user-facing message).'
      content:
        text/event-stream:
          schema:
            type: string
    ReportsForbidden:
      description: Caller is not permitted (wrong tenant, non-staff, or JWT-only endpoint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportsError'
    ReportsNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportsError'
    ReportsServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportsError'
    ReportsUnauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportsError'
  schemas:
    EmailsAuthError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    EmailsEmailList:
      type: object
      properties:
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailsMessage'
        count:
          type: integer
      required:
      - emails
      - count
    EmailsError:
      type: object
      properties:
        error:
          type: string
          description: Error message with any leading `Error:` prefix stripped.
      required:
      - error
    EmailsMessage:
      type: object
      description: One email message. `body` is a 240-character snippet on list and search endpoints and
        the full text on the thread endpoint.
      properties:
        id:
          type: string
        threadId:
          type: string
          nullable: true
        direction:
          type: string
          description: Message direction, e.g. `inbound` or `outbound`.
        from:
          type: string
          nullable: true
          description: Sender address.
        to:
          type: string
          nullable: true
          description: Recipient inbox address.
        cc:
          type: array
          items:
            type: string
        subject:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        attachments:
          type: integer
          description: Number of attachments on the message.
        isSeed:
          type: boolean
          nullable: true
        archived:
          type: boolean
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true
    EmailsSearchResult:
      type: object
      properties:
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailsMessage'
        count:
          type: integer
        query:
          type: string
          description: The trimmed query that was executed.
      required:
      - emails
      - count
      - query
    EmailsThreadDetail:
      type: object
      properties:
        threadId:
          type: string
        subject:
          type: string
          nullable: true
          description: Raw subject of the oldest message in the thread.
        messageCount:
          type: integer
        awaitingReply:
          type: boolean
        messages:
          type: array
          description: Messages oldest first, with full body text.
          items:
            $ref: '#/components/schemas/EmailsMessage'
      required:
      - threadId
      - messageCount
      - awaitingReply
      - messages
    EmailsThreadList:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/EmailsThreadSummary'
        count:
          type: integer
        openCount:
          type: integer
          description: Number of returned threads with awaitingReply true.
        truncated:
          type: boolean
          description: True when the 500-message scan cap was hit and older threads may be omitted.
      required:
      - threads
      - count
      - openCount
      - truncated
    EmailsThreadSummary:
      type: object
      properties:
        threadId:
          type: string
          description: Thread Message-ID, falling back to the message id when a message has no thread.
        subject:
          type: string
          description: 'Subject of the first message, with leading Re: prefixes stripped; `(no subject)`
            when empty.'
        participants:
          type: array
          items:
            type: string
          description: Union of senders and recorded to/cc addresses across the thread.
        messageCount:
          type: integer
        firstReceivedAt:
          type: string
          format: date-time
          nullable: true
        lastReceivedAt:
          type: string
          format: date-time
          nullable: true
        lastDirection:
          type: string
        awaitingReply:
          type: boolean
          description: True when the latest inbound message is newer than the latest outbound reply.
        lastSnippet:
          type: string
          description: First 160 characters of the latest message body.
      required:
      - threadId
      - subject
      - participants
      - messageCount
      - awaitingReply
    ReportsChatMessage:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          description: One of "user" or "assistant".
        content:
          type: string
        sessionId:
          type: string
          nullable: true
        metadata:
          nullable: true
          description: Stored message metadata blob.
        createdAt:
          type: string
          format: date-time
        inputTokens:
          type: integer
          nullable: true
        outputTokens:
          type: integer
          nullable: true
        feedback:
          nullable: true
          description: Present on assistant messages only; the caller's own rating, or null.
          type: object
          properties:
            rating:
              type: string
              enum:
              - positive
              - negative
            comment:
              type: string
              nullable: true
    ReportsChatMessageFeedback:
      type: object
      description: chat_message_feedback row as returned by the upsert.
      properties:
        id:
          type: string
        messageId:
          type: string
        userId:
          type: string
        reportId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        rating:
          type: string
          enum:
          - positive
          - negative
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportsChatStreamRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          description: The user message for this turn.
        sessionId:
          type: string
        model:
          type: string
          description: Override the agent's configured model id.
        anthropicApiKey:
          type: string
        googleApiKey:
          type: string
        includeDiscussions:
          type: boolean
        reportScreenshot:
          type: string
          description: Base64 data URL screenshot of the report.
        attachments:
          type: array
          items:
            type: string
          description: User-attached images as base64 data URLs; also handed to generate_image as references.
        posthogDistinctId:
          type: string
        posthogSessionId:
          type: string
        clientId:
          type: string
          description: Owning client for a `__draft-<sessionId>` session with no report row yet.
        editReportId:
          type: string
          description: Seed the draft from this existing report (edit flow).
        enabledDocs:
          type: array
          items:
            type: string
          description: Knowledge document ids this chat may read. Absent = all client docs; [] = none.
        enabledTools:
          type: object
          description: Per-chat opt-in tool augmentation layered on the always-on authoring tools.
          properties:
            builtins:
              type: array
              items:
                type: string
            mcpServerIds:
              type: array
              items:
                type: string
            skills:
              type: array
              items:
                type: string
            reportBuilding:
              type: boolean
            metrics:
              type: boolean
            alerts:
              type: boolean
            tasks:
              type: boolean
            prompts:
              type: boolean
            emails:
              type: boolean
            skillsManagement:
              type: boolean
            discussions:
              type: boolean
            slackKnowledge:
              type: boolean
            slackSend:
              type: boolean
            imageGen:
              type: boolean
            webBrowsing:
              type: boolean
            incrementality:
              type: boolean
            constraints:
              type: boolean
    ReportsError:
      type: object
      properties:
        error:
          type: string
    ReportsPromoteResult:
      type: object
      description: Result of committing a report's composed source into the monorepo.
      properties:
        committed:
          type: boolean
        reason:
          type: string
          description: Non-error outcome code, e.g. "no_token" (repo sync unconfigured) or "conflict".
        repo:
          type: string
        branch:
          type: string
        files:
          type: array
          items:
            type: object
            additionalProperties: true
        commitShas:
          type: object
          additionalProperties:
            type: string
        error:
          type: string
    ReportsSuccess:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'An API key from your portal, sent as `Authorization: Bearer secret_...`.'
security:
- bearerAuth: []
paths:
  /v1/alerts:
    get:
      operationId: listAlerts
      summary: List this client's alert rules
      description: 'Returns the authenticated client''s alert rules (summary fields only), newest first.
        Required scope: `alerts:read` OR `alerts:write` (requireAnyScope). Auth: API key; agency-wide
        keys must send X-Client-Id.'
      tags:
      - alerts
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys.
        schema:
          type: string
      responses:
        '200':
          description: Alert rule summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - alerts
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        clientId:
                          type: string
                        status:
                          type: string
                          enum:
                          - active
                          - paused
                          - error
                        lastRunAt:
                          type: string
                          format: date-time
                          nullable: true
                        lastTriggeredAt:
                          type: string
                          format: date-time
                          nullable: true
                        lastError:
                          type: string
                          nullable: true
                        conditionOperator:
                          type: string
                          nullable: true
                          enum:
                          - greater_than
                          - less_than
                          - equals
                          - not_equals
                          - greater_than_or_equal
                          - less_than_or_equal
                          - changed_by_percent
                          - ai_analysis
                        conditionCombinator:
                          type: string
                          enum:
                          - and
                          - or
                        scheduleType:
                          type: string
                          enum:
                          - interval
                          - cron
                        createdAt:
                          type: string
                          format: date-time
        '400':
          description: Agency-wide key sent no X-Client-Id header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: API key lacks the required scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: No client in this agency matches X-Client-Id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: X-Client-Id name is ambiguous across multiple clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
    post:
      operationId: createAlert
      summary: Create an alert rule with conditions and optional inline actions
      description: 'Validates the BigQuery SQL against the client''s dataset allowlist, rejects webhook
        URLs pointed at internal hosts, and checks that any Slack actions are reachable before persisting.
        At least one condition is required, supplied either as `conditions[]` or via the legacy single-condition
        fields (`conditionOperator` + `resultColumn`). Required scope: `alerts:write` (requireScope).'
      tags:
      - alerts
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - bigqueryQuery
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                bigqueryQuery:
                  type: string
                  minLength: 1
                scheduleType:
                  type: string
                  enum:
                  - interval
                  - cron
                  default: interval
                intervalMinutes:
                  type: integer
                  minimum: 1
                  default: 60
                cronExpression:
                  type: string
                  nullable: true
                timezone:
                  type: string
                  default: UTC
                lookbackMinutes:
                  type: integer
                  minimum: 1
                  default: 1440
                conditionCombinator:
                  type: string
                  enum:
                  - and
                  - or
                  default: and
                conditions:
                  type: array
                  minItems: 1
                  description: Multi-condition form. `ai_analysis` conditions require `conditionValue`
                    (the instruction text); all other operators require `resultColumn`.
                  items:
                    type: object
                    required:
                    - operator
                    properties:
                      operator:
                        type: string
                        enum:
                        - greater_than
                        - less_than
                        - equals
                        - not_equals
                        - greater_than_or_equal
                        - less_than_or_equal
                        - changed_by_percent
                        - ai_analysis
                      resultColumn:
                        type: string
                        nullable: true
                      conditionValue:
                        type: string
                        nullable: true
                      compareToColumn:
                        type: string
                        nullable: true
                      aiModel:
                        type: string
                        nullable: true
                      agentId:
                        type: string
                        nullable: true
                resultColumn:
                  type: string
                  nullable: true
                  description: Legacy single-condition field (mirrors condition
                conditionOperator:
                  type: string
                  description: Legacy single-condition field (mirrors condition
                  enum:
                  - greater_than
                  - less_than
                  - equals
                  - not_equals
                  - greater_than_or_equal
                  - less_than_or_equal
                  - changed_by_percent
                  - ai_analysis
                conditionValue:
                  type: string
                  nullable: true
                  description: Legacy single-condition field (mirrors condition
                compareToColumn:
                  type: string
                  nullable: true
                  description: Legacy single-condition field (mirrors condition
                aiModel:
                  type: string
                  nullable: true
                  description: Legacy single-condition field (mirrors condition
                actions:
                  type: array
                  items:
                    type: object
                    required:
                    - actionType
                    properties:
                      actionType:
                        type: string
                        enum:
                        - email
                        - webhook
                        - slack
                      emailRecipients:
                        type: string
                        nullable: true
                        description: JSON array of email addresses.
                      emailSubjectTemplate:
                        type: string
                        nullable: true
                      emailBodyTemplate:
                        type: string
                        nullable: true
                      webhookUrl:
                        type: string
                        format: uri
                        nullable: true
                      webhookMethod:
                        type: string
                        default: POST
                      webhookHeaders:
                        type: string
                        nullable: true
                        description: JSON object of headers.
                      webhookBodyTemplate:
                        type: string
                        nullable: true
                      slackConnectionId:
                        type: string
                        nullable: true
                      slackChannelId:
                        type: string
                        nullable: true
                        description: Required when actionType is `slack`.
                      slackChannelName:
                        type: string
                        nullable: true
                      slackMessageTemplate:
                        type: string
                        nullable: true
                      isEnabled:
                        type: boolean
                        default: true
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    type: object
                    description: Full alert_rules row.
                    properties:
                      id:
                        type: string
                      clientId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      bigqueryQuery:
                        type: string
                      resultColumn:
                        type: string
                        nullable: true
                      scheduleType:
                        type: string
                        enum:
                        - interval
                        - cron
                      intervalMinutes:
                        type: integer
                        nullable: true
                      cronExpression:
                        type: string
                        nullable: true
                      timezone:
                        type: string
                        nullable: true
                      lookbackMinutes:
                        type: integer
                      conditionOperator:
                        type: string
                        nullable: true
                      conditionValue:
                        type: string
                        nullable: true
                      compareToColumn:
                        type: string
                        nullable: true
                      aiModel:
                        type: string
                        nullable: true
                      conditionCombinator:
                        type: string
                        enum:
                        - and
                        - or
                      status:
                        type: string
                        enum:
                        - active
                        - paused
                        - error
                      lastRunAt:
                        type: string
                        format: date-time
                        nullable: true
                      lastTriggeredAt:
                        type: string
                        format: date-time
                        nullable: true
                      lastError:
                        type: string
                        nullable: true
                      consecutiveErrors:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                  actions:
                    type: array
                    items:
                      type: object
                      description: Full alert_actions row.
                      properties:
                        id:
                          type: string
                        alertRuleId:
                          type: string
                        actionType:
                          type: string
                          enum:
                          - email
                          - webhook
                          - slack
                        emailRecipients:
                          type: string
                          nullable: true
                        emailSubjectTemplate:
                          type: string
                          nullable: true
                        emailBodyTemplate:
                          type: string
                          nullable: true
                        webhookUrl:
                          type: string
                          nullable: true
                        webhookMethod:
                          type: string
                          nullable: true
                        webhookHeaders:
                          type: string
                          nullable: true
                        webhookBodyTemplate:
                          type: string
                          nullable: true
                        slackConnectionId:
                          type: string
                          nullable: true
                        slackChannelId:
                          type: string
                          nullable: true
                        slackChannelName:
                          type: string
                          nullable: true
                        slackMessageTemplate:
                          type: string
                          nullable: true
                        isEnabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  conditions:
                    type: array
                    items:
                      type: object
                      description: Full alert_conditions row.
                      properties:
                        id:
                          type: string
                        alertRuleId:
                          type: string
                        position:
                          type: integer
                        operator:
                          type: string
                          enum:
                          - greater_than
                          - less_than
                          - equals
                          - not_equals
                          - greater_than_or_equal
                          - less_than_or_equal
                          - changed_by_percent
                          - ai_analysis
                        resultColumn:
                          type: string
                          nullable: true
                        conditionValue:
                          type: string
                          nullable: true
                        compareToColumn:
                          type: string
                          nullable: true
                        aiModel:
                          type: string
                          nullable: true
                        agentId:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
        '400':
          description: Request body failed validation, the query referenced unauthorized tables, a webhook
            URL pointed at an internal host, a Slack action was unreachable, or an agency key sent no
            X-Client-Id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: API key lacks the `alerts:write` scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '404':
          description: No client in this agency matches X-Client-Id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  retryAfter:
                    type: integer
        '500':
          description: Failed to create alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to create alert
  /v1/alerts/preview-query:
    post:
      operationId: previewAlertQuery
      summary: Validate an alert query and preview its first rows
      description: 'Validates the SQL against the client''s dataset allowlist, then runs it capped at
        10 rows through the configured BigQuery MCP tool. Required scope: `alerts:read` OR `alerts:write`
        (requireAnyScope).'
      tags:
      - alerts
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Preview rows (raw BigQuery result rows, shape depends on the query)
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: Query validation failed, or request body invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  validation:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      unauthorizedTables:
                        type: array
                        items:
                          type: string
                      referencedTables:
                        type: array
                        items:
