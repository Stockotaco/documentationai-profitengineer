  /v1/report-authoring/save:
    post:
      operationId: saveReportSpec
      tags:
      - report-authoring
      summary: Compose and save a report from a ReportSpec
      description: 'Composes a report from a ReportSpec using the trusted server-side component library
        (the caller never writes HTML) and saves it. Without `report_id` the server composes a preview
        first and returns a live, token-gated preview URL plus lint. With `report_id` it updates the existing
        report.


        Trust: only trusted agency keys may set `publish: true`; every other caller''s save lands as a
        draft. Untrusted (client-scoped) keys must have a per-client `mcpGuardrails` policy configured
        (`requireClientGuardrails`) or the save is rejected.


        Auth: API key plus a resolved client.

        Required scope: `reports:write` (requireScope).

        Agency-wide keys must name the target client via `X-Client-Id`.'
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client (id, slug, or name). Required for agency-wide API keys; ignored for
          client-scoped keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - spec
              properties:
                spec:
                  type: object
                  additionalProperties: true
                  description: The ReportSpec (component ids + config + dataBindings + queries). Validated
                    as a free-form object at the route; the executor rejects an empty object.
                report_id:
                  type: string
                  description: Update this existing report instead of creating one.
                title:
                  type: string
                  description: Overrides `spec.title`.
                description:
                  type: string
                  description: Overrides `spec.description`.
                publish:
                  type: boolean
                  description: Publish immediately. Honoured only for trusted agency keys; otherwise the
                    save stays a draft.
      responses:
        '200':
          description: 'Saved. Three observed shapes from `executeReportAuthoringTool`: update (`{saved,
            report}`), trusted publish (`{saved, published, report, previewUrl, lint}`), and draft (`{saved,
            status, previewUrl, draftSlug, version, title, lint}`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
                  published:
                    type: boolean
                    description: Present only on the trusted publish path.
                  status:
                    type: string
                    enum:
                    - draft
                    description: Present only on the draft path.
                  report:
                    type: object
                    additionalProperties: true
                    description: The persisted report as returned by the report server's create/update
                      endpoint (untyped in the gateway).
                  previewUrl:
                    type: string
                    description: Token-gated live preview URL.
                  draftSlug:
                    type: string
                  version:
                    type: string
                  title:
                    type: string
                  lint:
                    type: object
                    additionalProperties: true
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
                additionalProperties: true
        '400':
          description: 'Zod validation failure, or an executor error envelope: missing / empty `spec`,
            invalid `spec_json`, a failed preview (`Report preview failed: <detail>`), or a guardrails
            rejection for an untrusted key.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: The API key lacks `reports:write`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: No client matching `X-Client-Id` exists in this agency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/report-authoring/sync:
    post:
      operationId: syncAuthoredReports
      tags:
      - report-authoring
      summary: File-based repo sync of a client's built reports
      description: 'Syncs an agency authoring repo''s reports for ONE client into the portal (the external
        equivalent of the monorepo''s CI sync). The payload carries BUILT report content; the portal owns
        rendering. Conflicts are resolved by `decideInboundReportSync`: portal-edited rows are flagged
        (`sync_status = ''conflict''`, losing version stashed in `sync_pending`), never clobbered, and
        portal-native rows are never touched. Slugs listed in `deleted` are archived (never portal-origin
        rows). Draft syncs mint a token-gated `previewUrl` on a best-effort basis.


        Tenancy: the target client comes from the resolved key context, never from the payload; `portal_client_id`
        is forced onto the written `client_configs` row and only whitelisted config fields are accepted
        (`service_account_key_path` and `mcp_servers` are dropped).


        Auth: API key plus a resolved client.

        Required scope: `reports:write` (requireScope) AND an agency-type key — client-scoped keys are
        rejected with 403.

        Agency-wide keys must name the target client via `X-Client-Id`.


        Body limit: 50 MB, enforced before validation.'
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: Target client (id, slug, or name). Required for agency-wide API keys; ignored for
          client-scoped keys.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - client
              properties:
                client:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{0,80}$
                  description: The caller repo's client slug (their `clients/<slug>/` folder). Keys `client_configs`
                    and the embed paths.
                client_config:
                  type: object
                  description: Optional client.config.json content — whitelisted fields only.
                  properties:
                    name:
                      type: string
                      maxLength: 200
                    gcp_project_id:
                      type: string
                      maxLength: 100
                    datasets:
                      type: object
                      additionalProperties:
                        type: string
                        maxLength: 200
                    branding:
                      type: object
                      properties:
                        company_name:
                          type: string
                          maxLength: 200
                reports:
                  type: array
                  default: []
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - slug
                    - name
                    - spec_hash
                    properties:
                      slug:
                        type: string
                        pattern: ^[a-z0-9][a-z0-9-]{0,80}$
                      name:
                        type: string
                        minLength: 1
                        maxLength: 200
                      description:
                        type: string
                        maxLength: 4000
                        nullable: true
                      category:
                        type: string
                        maxLength: 100
                        nullable: true
                      status:
                        type: string
                        enum:
                        - draft
                        - published
                        default: published
                      report_type:
                        type: string
                        maxLength: 40
                        nullable: true
                      bigquery_tables:
                        type: array
                        maxItems: 100
                        nullable: true
                        items:
                          type: string
                          maxLength: 300
                      report_meta:
                        type: object
                        nullable: true
                        additionalProperties: true
                        description: Arbitrary metadata. `report_meta.queries`, if present, is stored
                          separately as `report_queries` and feeds the report-sidebar AI prompt.
                      html_content:
                        type: string
                        maxLength: 2000000
                        nullable: true
                        description: Built HTML for the report (max 2MB).
                      spec_hash:
                        type: string
                        minLength: 8
                        maxLength: 128
                deleted:
                  type: array
                  default: []
                  maxItems: 100
                  description: Report slugs removed from the repo, archived in the portal.
                  items:
                    type: string
                    pattern: ^[a-z0-9][a-z0-9-]{0,80}$
      responses:
        '200':
          description: Sync completed; per-report outcomes in `results`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  client:
                    type: string
                    description: Echo of the request's repo client slug.
                  reportHost:
                    type: string
                    description: The host embed URLs were written against (legacy host for the home agency,
                      otherwise the agency's reports domain).
                  syncedBy:
                    type: string
                    description: Provenance string, `api_key:<id>`.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        action:
                          type: string
                          enum:
                          - create
                          - apply
                          - conflict
                          - skip
                          - archive
                          - error
                        reason:
                          type: string
                          description: Present when the sync decision carried one (e.g. `already-in-sync`).
                        previewUrl:
                          type: string
                          description: Minted for draft reports that were created, applied, or already
                            in sync.
                        error:
                          type: string
                          description: Present only when `action` is `error`.
        '400':
          description: Zod validation failure on the request body, or a missing `X-Client-Id` for an agency-wide
            key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: The key is not agency-scoped (`Report sync requires an agency-scoped API key.`),
            or it lacks `reports:write`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: No client matching `X-Client-Id` exists in this agency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Slug/tenancy conflict — the repo slug is bound to another client, the slug exists
            but is unbound to any portal client, this client is already synced under a different slug,
            or a non-home agency has no reports domain configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '413':
          description: Sync payload too large (max 50MB). Split the sync into fewer reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/report-authoring/validate-query:
