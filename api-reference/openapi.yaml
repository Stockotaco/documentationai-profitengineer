  /v1/constraints:
    get:
      operationId: diagnoseFunnel
      tags:
      - constraints
      summary: Diagnose which funnel step a paid campaign is stuck on
      description: 'Requires scope `constraints:read`.


        The headline endpoint: trust-gated, self-configuring, ranked. Delegates to the shared

        `diagnose_funnel` tool (`executeConstraintTool` -> `constraintsCore.diagnose`), which

        self-configures the conversion/lead event pairing off Mythic''s event inventory, gates the

        funnel on the tracking match rate and on conversion-credit coverage, and returns work

        items ranked by recoverable conversions.


        Scoped to the API key''s resolved client (`location_id`). The whole group also requires API

        key auth and a resolved client (`apiKeyAuth` + `requireResolvedClient` middleware) and is

        rate limited (`rateLimit`); the upstream Constraint Finder is 20 req/min per location.


        The large upstream `analysis` payload is omitted unless `include_raw=true`.

        '
      parameters:
      - &id002
        name: days
        in: query
        required: false
        description: Window length in days, inclusive of both ends. Ignored when `from` is given. Clamped
          to 1-365.
        schema:
          type: integer
          minimum: 1
          maximum: 365
      - &id003
        name: from
        in: query
        required: false
        description: Window start date (YYYY-MM-DD). Takes precedence over `days`.
        schema:
          type: string
          format: date
      - &id004
        name: to
        in: query
        required: false
        description: Window end date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - &id005
        name: group_by
        in: query
        required: false
        description: Grain of the analysis rows.
        schema:
          type: string
          enum:
          - campaign
          - adset
          - ad
      - &id006
        name: attribution
        in: query
        required: false
        description: Attribution model applied to sessions.
        schema:
          type: string
          enum:
          - session
          - first_touch
      - &id007
        name: table
        in: query
        required: false
        description: Meta ads-insights table name, when the client's differs from the platform default.
        schema:
          type: string
      - name: conversion_event
        in: query
        required: false
        description: Event name that counts as the conversion. Omitted means it is auto-selected upstream,
          and the choice is reported back in `config`.
        schema:
          type: string
      - name: lead_event
        in: query
        required: false
        description: Event name that counts as the lead. Supplying it splits the `site` step into `landing`
          and `sales`.
        schema:
          type: string
      - name: revenue_path
        in: query
        required: false
        description: Path to revenue on the conversion event.
        schema:
          type: string
      - name: campaign
        in: query
        required: false
        description: Drill into one campaign by id or name. Benchmarks stay account-wide.
        schema:
          type: string
      - name: attribution_window_days
        in: query
        required: false
        description: Days a paid touch may precede a conversion and still be credited. Clamped upstream
          to 0-365; 0 means own-session credit only.
        schema:
          type: integer
          minimum: 0
          maximum: 365
      - name: min_impressions
        in: query
        required: false
        description: Rows below this many impressions drop out of the ranking but still set the pooled
          benchmark.
        schema:
          type: integer
          minimum: 0
      - name: resolve_identities
        in: query
        required: false
        description: Resolve person identities when crediting conversions. Only the literal string `true`
          enables it.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: include_audit
        in: query
        required: false
        description: Run the tracking audit alongside the analysis. It is attached automatically whenever
          the trust verdict is not `ok`.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: include_raw
        in: query
        required: false
        description: Include Mythic's full untransformed `analysis` payload in the response.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: The ranked, trust-gated diagnosis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: object
                    properties:
                      days:
                        type: integer
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                  config:
                    type: object
                    description: Which event pairing the diagnosis actually used, and where it came from.
                    properties:
                      conversion_event:
                        type: string
                        nullable: true
                      lead_event:
                        type: string
                        nullable: true
                      revenue_path:
                        type: string
                        nullable: true
                      source:
                        type: string
                        enum:
                        - caller
                        - auto
                        - none
                      note:
                        type: string
                        description: Present only when no conversion event could be chosen.
                    required:
                    - conversion_event
                    - lead_event
                    - revenue_path
                    - source
                  brief:
                    type: object
                    description: The shared FunnelBrief read-model (shared/src/services/constraints.ts).
                    properties:
                      headline:
                        type: string
                        description: One sentence actionable without reading anything else.
                      trust:
                        type: object
                        description: Tracking match-rate gate. Floor is 0.7. `unknown` is not treated
                          as `ok`.
                        properties:
                          level:
                            type: string
                            enum:
                            - ok
                            - low
                            - unknown
                          matchRate:
                            type: number
                            nullable: true
                          message:
                            type: string
                            nullable: true
                            description: Present only when the funnel should not be read at face value.
                        required:
                        - level
                        - matchRate
                        - message
                      credit:
                        type: object
                        description: Conversion-credit coverage gate, independent of the tracking gate.
                          Floor is 0.5.
                        properties:
                          level:
                            type: string
                            enum:
                            - ok
                            - low
                            - none
                            - unknown
                          coverage:
                            type: number
                            nullable: true
                          credited:
                            type: number
                            nullable: true
                          total:
                            type: number
                            nullable: true
                          via_session:
                            type: number
                            nullable: true
                          via_person:
                            type: number
                            nullable: true
                          attribution_window_days:
                            type: number
                            nullable: true
                          message:
                            type: string
                            nullable: true
                        required:
                        - level
                        - coverage
                        - credited
                        - total
                        - message
                      by_step:
                        type: array
                        description: Recoverable conversions summed per step, reliable steps first, each
                          half biggest-first.
                        items:
                          type: object
                          properties:
                            step:
                              type: string
                              enum:
                              - ad
                              - tracking
                              - landing
                              - sales
                              - site
                            label:
                              type: string
                            recoverable_conversions:
                              type: number
                            rows:
                              type: integer
                            reliable:
                              type: boolean
                              description: False when the step is measured in conversions that mostly
                                could not be credited.
                          required:
                          - step
                          - label
                          - recoverable_conversions
                          - rows
                          - reliable
                      findings:
                        type: array
                        description: Constrained rows as ranked work items, ordered by recoverable conversions
                          with caveated findings last.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Campaign, ad set or ad name depending on `group_by`.
                            id:
                              type: string
                              nullable: true
                            step:
                              type: string
                              enum:
                              - ad
                              - tracking
                              - landing
                              - sales
                              - site
                            recoverable_conversions:
                              type: number
                              description: Extra conversions closing the gap would return over the window.
                                The ranking key.
                            recoverable_revenue:
                              type: number
                              nullable: true
                              description: Same, valued at this row's own revenue-per-conversion.
                            spend:
                              type: number
                              nullable: true
                            rate:
                              type: number
                              nullable: true
                            benchmark:
                              type: number
                              nullable: true
                            benchmark_source:
                              type: string
                              nullable: true
                              description: '`pooled` (the account average) versus a stored target.'
                            benchmark_note:
                              type: string
                              nullable: true
                            gap:
                              type: string
                              description: The shortfall as a sentence, e.g. "3.1x below the account average".
                            why:
                              type: string
                            fix:
                              type: string
                            landing_page:
                              type: string
                              nullable: true
                            counts:
                              type: object
                              nullable: true
                              description: The two absolute counts the rate is made of.
                              properties:
                                from:
                                  type: string
                                to:
                                  type: string
                                from_value:
                                  type: number
                                  nullable: true
                                to_value:
                                  type: number
                                  nullable: true
                            caveat:
                              type: string
                              nullable: true
                              description: Why this finding should not be actioned at face value. Set
                                when the step is conversion-denominated and credit coverage is thin.
                          required:
                          - name
                          - id
                          - step
                          - recoverable_conversions
                          - gap
                          - why
                          - fix
                          - caveat
                      scale:
                        type: array
                        description: Rows at or above the pooled rate on every step - budget candidates,
                          not optimisation candidates.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            id:
                              type: string
                              nullable: true
                            spend:
                              type: number
                              nullable: true
                            conversions:
                              type: number
                              nullable: true
                          required:
                          - name
                          - id
                          - spend
                          - conversions
                      totals:
                        type: object
                        properties:
                          rows:
                            type: integer
                          constrained:
                            type: integer
                          healthy:
                            type: integer
                          recoverable_conversions:
                            type: number
                          recoverable_revenue:
                            type: number
                            nullable: true
                          constrained_spend:
                            type: number
                            nullable: true
                          excluded_low_volume:
                            type: number
                            nullable: true
                            description: Rows the upstream dropped for volume; absent from `rows`.
                          min_impressions:
                            type: number
                            nullable: true
                        required:
                        - rows
                        - constrained
                        - healthy
                        - recoverable_conversions
                        - recoverable_revenue
                        - constrained_spend
                      next_steps:
                        type: array
                        description: Ordered, concrete actions. Empty when there is genuinely nothing
                          to do.
                        items:
                          type: string
                    required:
                    - headline
                    - trust
                    - credit
                    - by_step
                    - findings
                    - scale
                    - totals
                    - next_steps
                  attribution:
                    type: object
                    nullable: true
                    description: Upstream `conversion_attribution` block, passed through unshaped.
                    additionalProperties: true
                  audit:
                    type: object
                    nullable: true
                    description: 'Tracking audit, attached when `include_audit=true` or when the trust
                      verdict is not `ok`. A body of `{ unavailable: true, error }` means the audit ran
                      and failed - never "no tracking problems".'
                    additionalProperties: true
                  analysis:
                    type: object
                    description: Mythic's full untransformed analysis. Present only when `include_raw=true`.
                    additionalProperties: true
                required:
                - window
                - config
                - brief
                - attribution
                - audit
        '400':
          description: '`invalid_step` / `invalid_benchmark` / `invalid_window`, and the fallback status
            for any error whose code is unmapped or absent - including "the Constraint Finder is not configured
            for this client (Mythic Analytics not linked)".'
          content:
            application/json:
              schema: &id001
                type: object
                description: Error envelope unwrapped from the shared tool result.
                properties:
                  error:
                    type: string
                    description: Human-readable message, with any leading "[code]" stripped.
                  code:
                    type: string
                    description: Machine-readable upstream code, e.g. `dataset_missing`. Switch on this,
                      never on the prose.
                  retryAfter:
                    type: string
                    description: Seconds; mirrored into the `Retry-After` header on a 429.
                required:
                - error
        '404':
          description: '`campaign_not_found` / `not_found` - nothing matched.'
          content:
            application/json:
              schema: *id001
        '413':
          description: '`scan_limit_exceeded` - the query would scan too much data.'
          content:
            application/json:
              schema: *id001
        '422':
          description: '`insufficient_data` - nothing in this client''s data can serve as a conversion
            in this window. The message appends usable event candidates when any exist.'
          content:
            application/json:
              schema: *id001
        '424':
          description: 'An upstream or provisioning fault, deliberately not a 5xx of ours: `dataset_missing`,
            `ads_insights_missing`, `bq_unconfigured`, `upstream_error`, `query_failed`.'
          content:
            application/json:
              schema: *id001
        '429':
          description: '`rate_limited` - the upstream is 20 req/min per location.'
          headers:
            Retry-After: &id008
              description: Seconds to wait before retrying. Sent only when the upstream supplied it.
              schema:
                type: string
          content:
            application/json:
              schema: *id001
  /v1/constraints/analyze:
    get:
      operationId: analyzeFunnel
      tags:
      - constraints
      summary: Raw funnel analysis rows, untransformed
      description: 'Requires scope `constraints:read`.


        Mythic''s untransformed response, for callers that want the rows rather than the verdict.

        Delegates to the `analyze_funnel` tool (`constraintsCore.analyze`). No trust gate, no

        ranking, no self-configuration; reach for `GET /v1/constraints` unless you need the rows.


        Also requires API key auth plus a resolved client, and is rate limited.

        '
      parameters:
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - name: conversion_event
        in: query
        required: false
        description: Event name that counts as the conversion. Not auto-selected on this endpoint.
        schema:
          type: string
      - name: lead_event
        in: query
        required: false
        description: Event name that counts as the lead.
        schema:
          type: string
      - name: revenue_path
        in: query
        required: false
        schema:
          type: string
      - name: campaign
        in: query
        required: false
        schema:
          type: string
      - name: attribution_window_days
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 365
      - name: min_impressions
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: resolve_identities
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: benchmark_ad
        in: query
        required: false
        description: Benchmark override for the `ad` step as a RATE, not a percentage (2% is 0.02). Non-numeric
          values are ignored.
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: benchmark_tracking
        in: query
        required: false
        description: Benchmark override for the `tracking` step, as a rate between 0 and 1.
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: benchmark_landing
        in: query
        required: false
        description: Benchmark override for the `landing` step, as a rate between 0 and 1.
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: benchmark_sales
        in: query
        required: false
        description: Benchmark override for the `sales` step, as a rate between 0 and 1.
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: benchmark_site
        in: query
        required: false
        description: Benchmark override for the `site` step, as a rate between 0 and 1.
        schema:
          type: number
          minimum: 0
          maximum: 1
      responses:
        '200':
          description: Upstream analysis, returned as received (`json.data ?? json`). The shape is defined
            by Mythic's Constraint Finder API rather than by this gateway; the keys listed are the ones
            the shared read-model reads off it, and are indicative rather than exhaustive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows:
                    type: array
                    description: One row per campaign/ad set/ad at the requested grain, each optionally
                      carrying a `constraint` block.
                    items:
                      type: object
                      additionalProperties: true
                  tracking:
                    type: object
                    additionalProperties: true
                    description: Carries `match_rate`, the tracking trust gate's input.
                  conversion_attribution:
                    type: object
                    additionalProperties: true
                    description: Carries `total_conversions_in_window`, `credited_via_session`, `credited_via_person`,
                      `window_days`.
                  summary:
                    type: object
                    additionalProperties: true
                    description: Carries `window_days`.
                  diagnostic:
                    type: string
                    description: 'A response-level diagnostic instead of a funnel: `no_campaign_data`,
                      `no_conversion_events`, `no_conversions_attributed`, `campaign_not_found`.'
                  auto_selected:
                    type: object
                    additionalProperties: true
                  excluded_low_volume:
                    type: number
                  min_impressions:
                    type: number
        '400':
          description: '`invalid_step` / `invalid_benchmark` / `invalid_window`, and the fallback for
            any unmapped error code.'
          content:
            application/json:
              schema: *id001
        '404':
          description: '`campaign_not_found` / `not_found`.'
          content:
            application/json:
              schema: *id001
        '413':
          description: '`scan_limit_exceeded`.'
          content:
            application/json:
              schema: *id001
        '422':
          description: '`insufficient_data`.'
          content:
            application/json:
              schema: *id001
        '424':
          description: 'Upstream or provisioning fault: `dataset_missing`, `ads_insights_missing`, `bq_unconfigured`,
            `upstream_error`, `query_failed`.'
          content:
            application/json:
              schema: *id001
        '429':
          description: '`rate_limited`.'
          headers:
            Retry-After: *id008
          content:
            application/json:
              schema: *id001
