  /v1/incrementality/eligibility:
    get:
      operationId: checkGeoEligibility
      tags:
      - incrementality
      summary: Check whether this client is a viable geo-holdout candidate
      description: 'Requires scope `incrementality:read`.


        Pre-flight assessment: does the client have enough geographically spread conversion volume to
        run a Meta geo-holdout test? `daily_budget` sharpens the detectability check against realistic
        spend. `auto=true` has Mythic inventory the location''s conversion events and assess the best
        one, which is the fix for the all-zeros trap where the default purchase event does not exist.


        Proxies Mythic GET /client/v1/incrementality/eligibility; the 200 body is Mythic''s `data` passed
        through, so its field-level shape is owned by Mythic and not declared here.'
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: 'REQUIRED for agency-scoped API keys: names the target client by id, slug or name.
          Ignored for client-bound keys. Omitting it on an agency key returns 400; no match returns 404;
          an ambiguous name returns 409.'
        schema:
          type: string
      - name: daily_budget
        in: query
        required: false
        description: Planned daily ad budget. Coerced with Number(); a non-finite value is dropped by
          the core.
        schema:
          type: number
      - name: auto
        in: query
        required: false
        description: Send the exact string `true` to let Mythic pick the best conversion event. Anything
          else is false.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: measure
        in: query
        required: false
        description: '`revenue` (monetary value, Mythic''s default) or `count` for lead-gen events that
          carry no value.'
        schema:
          type: string
          enum:
          - revenue
          - count
      - name: event_name
        in: query
        required: false
        description: Conversion event to measure. Mythic defaults to the literal `purchase` event.
        schema:
          type: string
      - name: json_path
        in: query
        required: false
        description: Where the monetary value lives in the event properties, e.g. $.meta_amount. Mythic
          default $.value.
        schema:
          type: string
      - name: lookback_days
        in: query
        required: false
        description: 'Window in days, clamped by the core to 1..365. This is the lever for a scan_limit_exceeded
          failure: narrow the window.'
        schema:
          type: integer
          minimum: 1
          maximum: 365
      responses:
        '200':
          description: Mythic's eligibility payload, plus `notice` when the window was narrowed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  notice:
                    type: string
                    description: Present only when Mythic silently shortened the lookback window. Verdicts
                      are then NOT comparable with a full-window result.
                  window_narrowed:
                    type: object
                    additionalProperties: true
                    properties:
                      requested_lookback_days:
                        type: integer
                      used_lookback_days:
                        type: integer
                      reason:
                        type: string
        '400':
          description: 'The caller''s request is wrong, or an unmapped failure (400 is this route''s fallback
            status). Mapped codes: invalid_config, invalid_definition, unsupported_channel, scope_rejected.
            Also `Incrementality is not configured for this client (Mythic Analytics not linked)`.'
