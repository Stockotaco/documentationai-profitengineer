        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Trimmed by the core; empty or missing gives 400 (name is required).
                channel:
                  type: string
                  description: Optional channel label, e.g. meta. Stringified when present, omitted from
                    the upstream body when absent.
                definition:
                  type: object
                  additionalProperties: true
                  description: Geo-holdout definition. Must be a non-array JSON object or the request
                    fails with 400 (definition must be a JSON object). Field-level shape is validated
                    by Mythic, not the gateway.
