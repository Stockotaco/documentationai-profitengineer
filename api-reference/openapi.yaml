        Auth: API key. Agency-wide keys must also send `X-Client-Id`.

        '
      responses:
        '200':
          description: The skill
          content:
            application/json:
              schema:
                type: object
                required:
                - skill
                properties:
                  skill:
                    allOf:
                    - $ref: '#/x-schemas/Skill'
                    - type: object
                      properties:
                        scope:
                          type: string
                          enum:
                          - client
                          - agency
                          - platform
                        editable:
                          type: boolean
        '400':
          description: Agency-wide key did not resolve a target client
          content:
            application/json:
              schema:
                $ref: '#/x-schemas/Error'
        '401':
          description: Missing, malformed, revoked, or expired API key
          content:
