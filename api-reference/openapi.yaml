        '403':
          description: The API key lacks `reports:read` / `reports:write`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: No client matching `X-Client-Id` exists in this agency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/reports/authoring/ensure-draft-preview:
    post:
      operationId: ensureReportDraftPreview
      tags:
      - reports
      summary: Seed a session draft from an existing report and return a preview URL
      description: 'Edit-flow bootstrap for the Studio. Required scope: none declared on the route (this
        file has no requireScope/requireAnyScope). Access is enforced by the router-wide middleware `dualAuth`
        + `requireResolvedClient` + `rateLimit`, plus a per-request caller/client access check (platform_admin
        any client, agency_admin own agency, client user own client; agency API keys own agency, client
        keys own client).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientId
              - sessionId
              properties:
                clientId:
                  type: string
                  description: Portal client id the draft belongs to.
                sessionId:
                  type: string
                  description: Chat session id the draft is keyed on.
                editReportId:
                  type: string
                  description: Existing report to seed the draft from.
      responses:
        '200':
          description: Draft ensured
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  draftSlug:
                    type: string
                  previewUrl:
                    type: string
                    nullable: true
                  handEdited:
                    type: boolean
        '400':
          $ref: '#/components/responses/ReportsBadRequest'
        '401':
          $ref: '#/components/responses/ReportsUnauthorized'
        '403':
          $ref: '#/components/responses/ReportsForbidden'
        '404':
          $ref: '#/components/responses/ReportsNotFound'
        '500':
          $ref: '#/components/responses/ReportsServerError'
  /v1/reports/authoring/promote:
    post:
      operationId: promoteReportToMonorepo
      tags:
      - reports
      summary: Promote a published portal report into the monorepo as one commit
      description: 'Required scope: none declared on the route. Gated by `isTrustedAuthor` (staff / agency
        key) in the handler, on top of `dualAuth` + `requireResolvedClient` + `rateLimit`, plus the caller/client
        access check. `reportId` is the report SLUG, never a `__draft-` id. A missing GITHUB_MONOREPO_TOKEN
        returns 200 with `committed:false, reason:"no_token"`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientId
              - reportId
              properties:
                clientId:
                  type: string
                reportId:
                  type: string
                  description: Report slug to promote.
      responses:
        '200':
          description: Promote result (committed, or the unconfigured no_token state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsPromoteResult'
        '400':
          $ref: '#/components/responses/ReportsBadRequest'
        '403':
          $ref: '#/components/responses/ReportsForbidden'
        '404':
          $ref: '#/components/responses/ReportsNotFound'
        '500':
          $ref: '#/components/responses/ReportsServerError'
        '502':
          description: Compose or commit failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsPromoteResult'
  /v1/reports/authoring/resolve-conflict:
    post:
      operationId: resolveReportSyncConflict
      tags:
      - reports
      summary: Resolve a report's portal/monorepo sync conflict
      description: 'Required scope: none declared on the route. Gated by `isTrustedAuthor` (staff) in
        the handler, on top of `dualAuth` + `requireResolvedClient` + `rateLimit`, plus the caller/client
        access check. `keep-portal` force-promotes the portal version; `pull-monorepo` applies the stashed
        (or re-fetched HEAD) monorepo version to the portal row.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - clientId
              - reportId
              - resolution
              properties:
                clientId:
                  type: string
                reportId:
                  type: string
                  description: Report slug.
                resolution:
                  type: string
                  enum:
                  - keep-portal
                  - pull-monorepo
      responses:
        '200':
          description: Conflict resolved. `keep-portal` returns the resolution plus the promote result
            fields; `pull-monorepo` returns the applied spec hash and source.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - type: object
                    properties:
                      resolution:
                        type: string
                        enum:
                        - keep-portal
                  - $ref: '#/components/schemas/ReportsPromoteResult'
                - type: object
                  properties:
                    resolution:
                      type: string
                      enum:
                      - pull-monorepo
                    ok:
                      type: boolean
                    specHash:
