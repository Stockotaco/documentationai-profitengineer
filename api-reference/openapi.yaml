        '404':
          description: '`not_found`.'
          content:
            application/json:
              schema: *id001
        '413':
          description: '`scan_limit_exceeded`.'
          content:
            application/json:
              schema: *id001
        '422':
          description: '`insufficient_data`.'
          content:
            application/json:
              schema: *id001
        '424':
          description: Upstream or provisioning fault.
          content:
            application/json:
              schema: *id001
        '429':
          description: '`rate_limited`.'
          headers:
            Retry-After: *id008
          content:
            application/json:
              schema: *id001
  /v1/documents:
    get:
      operationId: listDocuments
      summary: List documents
      description: 'Lists the authenticated client''s Studio knowledge documents (metadata only,

        no document body), newest first by createdAt. `clientId` is derived from the

        API key; agency-scoped keys may pass `X-Client-Id` to target a client in their

        agency. Agency-only documents are returned only for agency-type keys.


        Required scope: `documents:read` OR `documents:write` (requireAnyScope).

        '
      tags:
      - documents
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: 'Agency-scoped keys only: target client id within the agency. Ignored for client-scoped
          keys, which always resolve to their own client.'
        schema:
          type: string
      responses:
        '200':
          description: Document metadata list
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required:
                - documents
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - category
                      - sourceLink
                      - fileType
                      - sizeBytes
                      - agencyOnly
                      - createdAt
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        category:
                          type: string
                          nullable: true
                        sourceLink:
                          type: string
                          nullable: true
                        fileType:
                          type: string
                          description: Lowercased file extension, fixed at creation.
                          example: md
                        sizeBytes:
                          type: integer
                        agencyOnly:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Missing required scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Permission denied
                  message:
                    type: string
                    example: 'Requires one of: documents:read, documents:write'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Rate limit exceeded
                  message:
                    type: string
                  retryAfter:
                    type: integer
                    description: Seconds until the window resets.
    post:
      operationId: createDocument
      summary: Create a document
      description: 'Creates a document for the authenticated client. `name` must carry an allowed

        text extension (txt, md, markdown, csv, tsv, json, log) or the request is

        rejected with 415; `content` over 1,000,000 bytes (UTF-8) is rejected with 413.

        `agencyOnly: true` requires an agency-scoped key (403 otherwise).

        Response carries metadata only (the body is not echoed back).


        Required scope: `documents:write`.

        '
      tags:
      - documents
      parameters:
      - name: X-Client-Id
        in: header
        required: false
        description: 'Agency-scoped keys only: target client id within the agency.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - content
              properties:
                name:
                  type: string
                  minLength: 1
                  description: File name including extension; the extension sets fileType.
                  example: pricing-notes.md
                content:
                  type: string
                  description: Full document text (max 1,000,000 bytes UTF-8).
                category:
                  type: string
                  nullable: true
                sourceLink:
                  type: string
                  nullable: true
                agencyOnly:
                  type: boolean
                  description: Agency-internal document, hidden from client-scoped keys. Accepts loosely-typed
                    truthy values (coerced via coerceBooleanArg). Setting true requires an agency-scoped
                    key.
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                type: object
                required:
                - document
                properties:
                  document:
                    type: object
                    required:
                    - id
                    - name
                    - category
                    - sourceLink
                    - fileType
                    - sizeBytes
                    - agencyOnly
                    - createdAt
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                        nullable: true
                      sourceLink:
                        type: string
                        nullable: true
                      fileType:
                        type: string
                      sizeBytes:
                        type: integer
                      agencyOnly:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Request body failed validation
          content:
            application/json:
              schema:
                type: object
