  /v1/metrics:
    get:
      operationId: listMetrics
      tags:
      - metrics
      summary: List this client's metrics
      description: 'Lists every metric belonging to the API key''s resolved client, each rendered through
        the shared `buildMetricView` read model (current source-grain period summary, plus a derived fiscal-year
        grid or flat period list when `year` is given). Required scope: `metrics:read` OR `metrics:write`
        (requireAnyScope). Agency-wide keys must also send `X-Client-Id`.'
      parameters:
      - name: year
        in: query
        required: false
        description: Fiscal year. When a valid integer, each metric gains `grid` (monthly, quarterly,
          annual grains) or `periodList` (weekly, daily grains). Non-integer values are ignored rather
          than rejected.
        schema:
          type: integer
      - name: X-Client-Id
        in: header
        required: false
        description: Target client id, slug, or name. Required for agency-wide API keys (400 when missing);
          ignored for client-scoped keys.
        schema:
          type: string
      responses:
        '200':
          description: The client's metrics.
          content:
            application/json:
              schema:
                type: object
                required:
                - metrics
                properties:
                  metrics:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - definition
                      - calculation
                      - governed
                      - format
                      - unit
                      - sourceGrain
                      - direction
                      - displayOrder
                      - periods
                      - currentLabel
                      - current
                      - reportIds
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        definition:
                          type: string
                          nullable: true
                        calculation:
                          type: string
                          nullable: true
                        governed:
                          type: boolean
                          description: True when the metric has governed SQL. The SQL itself is never
                            returned.
                        format:
                          type: string
                        unit:
                          type: string
                          nullable: true
                        sourceGrain:
                          type: string
                          enum:
                          - daily
                          - weekly
                          - monthly
                          - quarterly
                          - annual
                        direction:
                          type: string
                          enum:
                          - higher_is_better
                          - lower_is_better
                        displayOrder:
                          type: integer
                        periods:
                          type: array
                          items:
                            type: object
                            required:
                            - periodLabel
                            - periodStart
                            - periodEnd
                            - target
                            - actual
                            properties:
                              periodLabel:
                                type: string
                              periodStart:
                                type: string
                                nullable: true
                              periodEnd:
                                type: string
                                nullable: true
                              target:
                                type: number
                                nullable: true
                              actual:
                                type: number
                                nullable: true
                        currentLabel:
                          type: string
                          description: Label of the metric's current source-grain period; always set,
                            even with no stored row.
                        current:
                          type: object
                          nullable: true
                          required:
                          - periodLabel
                          - target
                          - actual
                          - percent
                          - status
                          properties:
                            periodLabel:
                              type: string
                            target:
                              type: number
                              nullable: true
                            actual:
                              type: number
                              nullable: true
                            percent:
                              type: number
                              nullable: true
                            status:
                              type: string
                              nullable: true
                              enum:
                              - good
                              - warn
                              - bad
                        reportIds:
                          type: array
                          items:
                            type: string
                        grid:
                          type: array
                          description: Present only when `year` is supplied and the grain is monthly,
                            quarterly, or annual.
                          items:
                            type: object
                            required:
                            - label
                            - grain
                            - target
                            - actual
                            - mode
                            - percent
                            - status
                            properties:
                              label:
                                type: string
                              grain:
                                type: string
                                enum:
                                - daily
                                - weekly
                                - monthly
                                - quarterly
                                - annual
                              target:
                                type: number
                                nullable: true
                              actual:
                                type: number
                                nullable: true
                              mode:
                                type: string
                                enum:
                                - source
                                - rollup
                                - amortize
                                - empty
                              percent:
                                type: number
                                nullable: true
                              status:
                                type: string
                                nullable: true
                                enum:
                                - good
                                - warn
                                - bad
                        periodList:
                          type: array
                          description: Present only when `year` is supplied and the grain is weekly or
                            daily.
                          items:
                            type: object
                            required:
                            - label
                            - target
                            - actual
                            - percent
                            - status
                            properties:
                              label:
                                type: string
                              target:
                                type: number
                                nullable: true
                              actual:
                                type: number
                                nullable: true
                              percent:
                                type: number
                                nullable: true
                              status:
                                type: string
                                nullable: true
                                enum:
                                - good
                                - warn
                                - bad
        '400':
          description: Agency-wide key without an `X-Client-Id` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '403':
          description: Key lacks both `metrics:read` and `metrics:write`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Permission denied
                  message:
                    type: string
        '404':
          description: '`X-Client-Id` matched no client in this agency.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: '`X-Client-Id` name matched more than one client.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
