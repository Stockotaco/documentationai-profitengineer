  /v1/scheduled-tasks/runs/{runId}:
    parameters:
    - name: runId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getScheduledTaskRun
      summary: Get one run with its proposals
      description: 'Returns the run and its parent task. Scoped to the run''s effective client (the run''s
        own

        `clientId`, falling back to the task''s), so a fan-out run can be addressed by the target

        client it ran against. Required scope: `tasks:read` OR `tasks:write`.

        '
      tags:
      - scheduled-tasks
      responses:
        '200':
          description: The run and its task
          content:
            application/json:
              schema:
                type: object
                required:
                - run
                - task
