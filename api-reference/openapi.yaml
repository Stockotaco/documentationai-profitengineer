        '404':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/ClientNotFound'
        '409':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/AmbiguousClient'
        '429':
          $ref: '#/paths/~1v1~1scheduled-tasks/get/x-schemas/RateLimited'
      x-schemas:
        ScheduledTask:
